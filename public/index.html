async function trackOrder(code, phone, out) {

    if (r.status === 404) { out.innerHTML = '<p class="err">Aucune commande trouvée avec ce code et ce numéro.</p>'; return; }
    if (!r.ok) { const d = await r.json().catch(() => ({})); throw new Error(d.error || "Une erreur est survenue."); }
    const o = await r.json();
    HIST = [o];
    out.innerHTML = orderHtml(o);
    out.querySelectorAll("[data-reorder]").forEach(b => b.onclick = () => reorder(b.dataset.reorder));
    saveGuest(o.customer, o.phone);
    try { localStorage.setItem("lc-last", JSON.stringify({ code: o.code, phone: o.phone })); } catch (e) {}
  } catch (e) {
    out.innerHTML = '<p class="err">' + escH(e.message || "Une erreur est survenue. Veuillez réessayer.") + '</p>';
  }
}

function rsvRender(){
  const root=$("#rsvroot");if(!root||!rsvCfg||!rsvState)return;
  const phone=rsvCfg.phone||PHONE;
  if(!rsvCfg.enabled){root.innerHTML='<div class="box"><h3>Réservation en ligne indisponible</h3><p>Le restaurant ne prend pas de réservation en ligne pour le moment. Appelez-nous au <a href="tel:+'+phone+'">'+rsvPhone(phone)+'</a>.</p></div>';return}
  if(!rsvCfg.hoursConfigured){root.innerHTML='<div class="box rsvnote"><b>Réservation par téléphone</b><p>Les horaires du restaurant ne sont pas encore publiés en ligne. Appelez-nous : nous notons votre table avec plaisir.</p><a class="btn dark" href="tel:+'+phone+'">📞 Appeler '+rsvPhone(phone)+'</a></div>';return}
  if(rsvState.result){root.innerHTML=rsvDone();rsvBindResult();return}
  root.innerHTML='<div class="cols rsv"><div class="box">'+rsvCalendar()+'<p class="muted tiny" style="margin:10px 0 0">Les jours grisés sont fermés ou hors de la période de réservation.</p></div>'
    +'<div class="box">'+(rsvState.edit?rsvEditNote():"")+(rsvState.date===rsvCfg.today?rsvSameDay():"")
    +'<div class="rsvstep"><span class="n">1</span> Votre table</div>'+rsvSeating()
    +'<div class="rsvstep"><span class="n">2</span> Votre créneau</div>'+rsvSlots()
    +'<div class="rsvstep"><span class="n">3</span> Vos coordonnées</div>'+rsvForm()+'</div></div>';
  rsvBindForm();
}
function rsvCalendar(){
  const y=rsvState.y,m=rsvState.m,today=rsvCfg.today,max=rsvAddDays(today,rsvCfg.leadDays);
  const pad=(new Date(Date.UTC(y,m,1)).getUTCDay()+6)%7,days=new Date(Date.UTC(y,m+1,0)).getUTCDate();
  const cur=y+"-"+String(m+1).padStart(2,"0");
  let cells="";
  for(let i=0;i<pad;i++)cells+='<span class="rsvcal-pad"></span>';
  for(let d=1;d<=days;d++){
    const ds=cur+"-"+String(d).padStart(2,"0");
    const dis=ds<today||ds>max||!rsvOpen(ds);
    const cls="rsvcal-day"+(dis?" dis":"")+(ds===rsvState.date?" on":"")+(ds===today?" today":"");
    cells+='<button type="button" class="'+cls+'"'+(dis?' disabled aria-disabled="true"':'')+' data-rsvdate="'+ds+'">'+d+'</button>';
  }
  return '<div class="rsvcal"><div class="rsvcal-h"><button type="button" class="rsvcal-nav" data-rsvmonth="-1"'+(cur<=today.slice(0,7)?' disabled':'')+' aria-label="Mois précédent">‹</button><strong>'+RSV_MONTHS[m]+' '+y+'</strong><button type="button" class="rsvcal-nav" data-rsvmonth="1"'+(cur>=max.slice(0,7)?' disabled':'')+' aria-label="Mois suivant">›</button></div><div class="rsvcal-wd">'+RSV_DOW.map(d=>'<span>'+d+'</span>').join("")+'</div><div class="rsvcal-grid">'+cells+'</div></div>';
}
function rsvSlots(){
  if(!rsvState.date)return '<p class="muted">Choisissez d’abord une date.</p>';
  if(!rsvState.zone||!rsvState.capacity)return '<p class="muted">Choisissez d’abord une table.</p>';
  const day=rsvState.day;
  if(!day)return '<p class="muted">Chargement des créneaux…</p>';
  if(day.closed){const msg=day.reason==="hours"?"Les horaires ne sont pas publiés en ligne.":day.reason==="range"?"Cette date est hors de la période de réservation.":"Le restaurant est fermé ce jour-là.";return '<p class="muted">'+msg+'</p>'}
  if(!day.slots||!day.slots.length)return '<p class="muted">Aucun créneau disponible ce jour-là.</p>';
  const zone=rsvState.zone,cap=rsvState.capacity;
  const cells=day.slots.map(s=>{const left=(s.avail&&s.avail[zone]&&s.avail[zone][cap])||0,dis=left<=0;return '<button type="button" class="rsvslot'+(dis?" dis":"")+(rsvState.time===s.time?" on":"")+'"'+(dis?' disabled':'')+' data-rsvtime="'+s.time+'">'+s.time+'</button>'}).join("");
  return '<div class="rsvslots">'+cells+'</div>';
}
function rsvSeating(){
  const inv=rsvCfg.inventory||{};
  const zones=Object.keys(rsvCfg.zones||{}).filter(z=>Object.values(inv[z]||{}).some(n=>n>0));
  if(!zones.length)return '<p class="muted">Aucune table configurée pour le moment. Appelez le restaurant.</p>';
  const caps=(rsvCfg.zones[rsvState.zone]||[]).filter(c=>(inv[rsvState.zone]||{})[c]>0);
  const zbtn=zones.map(z=>'<button type="button" class="'+(rsvState.zone===z?"on":"")+'" data-rsvzone="'+z+'">'+(RSV_ZONE_NAME[z]||z)+'</button>').join("");
  const cbtn=caps.map(c=>'<button type="button" class="'+(rsvState.capacity===c?"on":"")+'" data-rsvcap="'+c+'">'+c+' pers.</button>').join("");
  const party=Array.from({length:rsvState.capacity||1},(_,i)=>i+1).map(n=>'<option value="'+n+'"'+(n===rsvState.party?" selected":"")+'>'+n+'</option>').join("");
  return '<label>Zone</label><div class="rsvseg">'+zbtn+'</div><label>Type de table</label><div class="rsvseg small">'+cbtn+'</div><label for="rsvParty">Nombre de personnes</label><select id="rsvParty">'+party+'</select>';
}
function rsvForm(){
  return '<label for="rsvName">Nom</label><input id="rsvName" autocomplete="name" value="'+escH(rsvState.name||"")+'">'
    +'<label for="rsvPhone">Téléphone</label><input id="rsvPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="05 / 06 / 07 …" value="'+escH(rsvState.phone||"")+'"'+(rsvState.edit?' readonly aria-readonly="true"':'')+'>'
    +'<label for="rsvNote">Remarque (facultatif)</label><input id="rsvNote" maxlength="200" placeholder="Occasion, table près de la fenêtre…" value="'+escH(rsvState.note||"")+'">'
    +'<div class="err" id="rsvErr">'+escH(rsvState.err||"")+'</div>'
    +'<button type="button" class="btn" id="rsvSend" style="width:100%;margin-top:6px"'+(rsvState.busy?" disabled":"")+'>'+(rsvState.busy?"Envoi…":(rsvState.edit?"Enregistrer les modifications":"Demander cette table"))+'</button>';
}
function rsvSameDay(){
  const phone=rsvCfg.phone||PHONE;
  return '<div class="rsvnote"><b>Vous réservez pour aujourd’hui</b><p>La disponibilité change au fil de la journée : le plus simple est de nous appeler pour réserver en direct.</p><a class="btn dark" href="tel:+'+phone+'">📞 Appeler '+rsvPhone(phone)+'</a><p class="muted tiny" style="margin:8px 0 0">Vous pouvez aussi envoyer votre demande : elle sera marquée « vérification par téléphone ».</p></div>';
}
function rsvEditNote(){
  return '<div class="rsvnote"><b>Modification de la réservation '+escH((rsvState.edit&&rsvState.edit.code)||"")+'</b>'
    +'<p>Choisissez le nouveau créneau puis enregistrez. Votre réservation repassera en attente et l’équipe la confirmera à nouveau.</p>'
    +'<button type="button" class="btn ghost" id="rsvCancel">Annuler la modification</button></div>';
}
function rsvFinished(r){                                          // the server only returns a booking that still holds a table; once it is settled the customer may book again
  return !!r&&(r.status==="completed"||r.status==="cancelled"||r.status==="rejected");
}
function rsvDone(){
  const r=rsvState.result,S=RSV_STATUS[r.status]||{t:r.status||"Enregistrée",c:"wait",d:""};
  const phone=rsvCfg.phone||PHONE,zone=RSV_ZONE_NAME[r.zone]||r.zone||"";
  return '<div class="box rsvdone"><span class="rsvbadge '+S.c+'">'+S.t+'</span>'
    +'<h3 style="margin:12px 0 4px">Table '+(r.party?("pour "+r.party+" personne"+(r.party>1?"s":"")):"")+'</h3>'
    +'<p class="muted">'+rsvDateLabel(r.date)+' à '+escH(r.time||"")+(zone?" · "+zone:"")+(r.capacity?" · table "+r.capacity+' personnes':"")+'</p>'
    +'<p class="rsvcode">Code : <b>'+escH(r.code||"")+'</b></p>'
    +'<p>'+S.d+'</p>'
    +(r.status==="phone_required"?'<a class="btn dark" href="tel:+'+phone+'">📞 Appeler '+rsvPhone(phone)+'</a>':"")
    +(r.adminNote?'<p class="rsvadmin">Message du restaurant : '+escH(r.adminNote)+'</p>':"")
    +((r.status==="pending"||r.status==="phone_required"||r.status==="approved")?'<button type="button" class="btn ghost" id="rsvEdit">Modifier ma réservation</button>':"")
    +(rsvFinished(r)?'<button type="button" class="btn ghost" id="rsvNew">Nouvelle réservation</button>':'<p class="muted tiny" style="margin:10px 0 0">Vous pourrez réserver une nouvelle table une fois cette réservation terminée.</p>')
    +'<p class="muted tiny" style="margin:12px 0 0">Le statut se met à jour en direct tant que cette page reste ouverte.</p></div>';
}
function rsvBindForm(){
  document.querySelectorAll("[data-rsvmonth]").forEach(b=>b.onclick=()=>rsvMonth(+b.dataset.rsvmonth));
  document.querySelectorAll("[data-rsvdate]").forEach(b=>b.onclick=()=>rsvSelectDate(b.dataset.rsvdate));
  document.querySelectorAll("[data-rsvzone]").forEach(b=>b.onclick=()=>{rsvState.zone=b.dataset.rsvzone;rsvEnsureChoice();rsvState.time="";rsvRender()});
  document.querySelectorAll("[data-rsvcap]").forEach(b=>b.onclick=()=>{rsvState.capacity=+b.dataset.rsvcap;if(rsvState.party>rsvState.capacity)rsvState.party=rsvState.capacity;rsvState.time="";rsvRender()});
  document.querySelectorAll("[data-rsvtime]").forEach(b=>b.onclick=()=>{rsvState.time=b.dataset.rsvtime;rsvState.err="";rsvRender()});
  const p=$("#rsvParty");if(p)p.onchange=()=>{rsvState.party=+p.value;rsvState.err=""};
  const nm=$("#rsvName");if(nm)nm.oninput=()=>{rsvState.name=nm.value};
  const ph=$("#rsvPhone");if(ph)ph.oninput=()=>{rsvState.phone=ph.value};
  const nt=$("#rsvNote");if(nt)nt.oninput=()=>{rsvState.note=nt.value};
  const send=$("#rsvSend");if(send)send.onclick=rsvSubmit;
  const cancel=$("#rsvCancel");if(cancel)cancel.onclick=rsvCancelEdit;
}
function rsvBindResult(){
  const b=$("#rsvNew");if(b)b.onclick=()=>{if(rsvES){try{rsvES.close()}catch(e){}}rsvES=null;rsvESCode=null;rsvState.result=null;rsvState.edit=null;rsvState.time="";rsvState.err="";try{localStorage.removeItem("lc-resv")}catch(e){}rsvRender()};
  const e=$("#rsvEdit");if(e)e.onclick=rsvEdit;
}
function rsvEdit(){
  const r=rsvState.result;if(!r||!r.code)return;
  rsvState.edit={code:r.code,phone:r.phone,back:r};
  rsvState.name=r.name||rsvState.name;rsvState.phone=r.phone||rsvState.phone;rsvState.note=r.note||"";
  rsvState.zone=r.zone;rsvState.capacity=r.capacity;rsvState.party=r.party;rsvState.result=null;rsvState.err="";
  const p=(r.date||"").split("-");if(p.length===3){rsvState.y=+p[0];rsvState.m=+p[1]-1}
  rsvEnsureChoice();
  if(r.date)rsvSelectDate(r.date,true);else rsvRender();

function rsvCancelEdit(){if(!rsvState.edit)return;rsvState.result=rsvState.edit.back||null;rsvState.edit=null;rsvState.err="";rsvRender()}
function rsvMonth(d){
  let y=rsvState.y,m=rsvState.m+d;
  if(m<0){m=11;y--}else if(m>11){m=0;y++}
  const cur=y+"-"+String(m+1).padStart(2,"0"),min=rsvCfg.today.slice(0,7),max=rsvAddDays(rsvCfg.today,rsvCfg.leadDays).slice(0,7);

  rsvState.y=y;rsvState.m=m;rsvRender();
}
async function rsvSubmit(){
  const st=rsvState;if(!st||st.busy)return;
  const name=(st.name||"").trim(),phone=(st.phone||"").trim();
  if(name.length<2)st.err="Indiquez votre nom.";
  else if(phone.replace(/\D/g,"").length<8)st.err="Indiquez un numéro de téléphone valide.";
  else if(!st.date)st.err="Choisissez une date.";
  else if(!st.time)st.err="Choisissez un créneau.";
  else if(!st.zone||!st.capacity)st.err="Choisissez une table.";
  else st.err="";
  if(st.err){rsvRender();return}
  st.busy=true;rsvRender();
  try{
    const editing=!!st.edit;
    const url=editing?("/api/reservations/"+encodeURIComponent(st.edit.code)):"/api/reservations";
    const r=await fetch(url,{method:editing?"PATCH":"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,phone,date:st.date,time:st.time,zone:st.zone,capacity:st.capacity,party:st.party,note:(st.note||"").trim()})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||"Une erreur est survenue.");
    st.busy=false;st.result=d;st.edit=null;saveGuest(name,phone);
    try{localStorage.setItem("lc-resv",JSON.stringify({code:d.code,phone:d.phone,status:d.status,date:d.date,time:d.time,zone:d.zone,capacity:d.capacity,party:d.party}))}catch(e){}
    rsvRender();rsvWatch();
  }catch(e){st.busy=false;st.err=e.message||"Une erreur est survenue.";rsvRender()}
}
function rsvWatch(){
  const r=rsvState&&rsvState.result;
  if(!r||!r.code||!r.phone)return;                                 // the stream is scoped to this one booking
  if(rsvES&&rsvESCode===r.code)return;
  if(rsvES){try{rsvES.close()}catch(e){}rsvES=null}
  try{
    rsvESCode=r.code;
    rsvES=new EventSource("/api/reservations/stream?code="+encodeURIComponent(r.code)+"&phone="+encodeURIComponent(r.phone));
    rsvES.addEventListener("reservation",e=>{
      let d;try{d=JSON.parse(e.data)}catch(x){return}
      if(rsvState&&rsvState.result&&d.code===rsvState.result.code){
        rsvState.result=Object.assign({},rsvState.result,d);
        try{localStorage.setItem("lc-resv",JSON.stringify(rsvState.result))}catch(x){}
        if(location.hash.replace(/^#\/?/,"")==="reservation")rsvRender();
      }
    });
  }catch(e){rsvES=null;rsvESCode=null}
}
function rsvTrack(code,phone){
  if(!code||!phone)return;
  rsvWatch();
  fetch("/api/reservations/"+encodeURIComponent(code)+"?phone="+encodeURIComponent(phone)).then(r=>r.ok?r.json():null).then(d=>{
    if(d&&rsvState&&rsvState.result&&rsvState.result.code===d.code){rsvState.result=Object.assign({},rsvState.result,d);try{localStorage.setItem("lc-resv",JSON.stringify(rsvState.result))}catch(e){}rsvRender()}
  }).catch(()=>{});
}
function route(){const r=(location.hash.replace(/^#\/?/,"")||"");const k=PAGES[r]?r:"";$("#app").innerHTML=PAGES[k]();document.body.dataset.p=k;
document.querySelectorAll(".nav nav a").forEach(a=>a.classList.toggle("on",a.dataset.r===k));
if(k==="menu"){drawMenu();renderService()}if(k==="reservation")initReservations();if(k==="livraison")initLiv();if(k==="compte"){refreshService().then(()=>{renderService();initMyOrders()})}window.scrollTo(0,0)}
